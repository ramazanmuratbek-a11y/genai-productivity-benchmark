name: Reproducibility checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt
      - name: Unit tests (SS7, SS8, SS9 and existing tests)
        run: python -m unittest discover -s tests -v
      - name: Synthetic demo (not real findings)
        run: |
          python src/randomize.py --count 8
          python src/validate_data.py data/sample/example_measurements.csv
          python src/analyze.py
      - name: SS7 JSONL software-measurement smoke test
        run: |
          python src/collector.py --config configs/collector.yaml
          python -c "import json; from pathlib import Path; records=[json.loads(x) for x in Path('data/raw/test_run.jsonl').read_text().splitlines()]; assert len(records)==106; assert records[0]['event_type']=='metadata'; assert sum(x.get('phase')=='warmup' for x in records)==5; assert sum(x.get('phase')=='benchmark' for x in records)==100"
      - name: SS8 software JSONL processing and figures
        run: |
          python src/process_ss7_logs.py --input data/sample/ss7_software_benchmark_demo.jsonl
          python src/visualize_ss7_logs.py
          python -c "import pandas as pd; x=pd.read_csv('data/processed/ss8_software_metrics_summary.csv'); assert int(x.loc[x['group']=='overall','benchmark_runs'].iloc[0])==100; assert x.iloc[0]['measurement_unit']=='milliseconds'"
      - name: SS9 synthetic report and booktabs consistency
        run: python src/generate_ss9_report.py --check
